# Hanna Installment: kisi dukaan ke Firebase project par Firestore RULES + INDEXES deploy (phone se, bina Termux).
# Actions > "Deploy Firebase (rules + indexes)" > Run workflow > project id likhein.
# Ek dafa: Firebase > Project settings > Service accounts > "Generate new private key" -> JSON ka poora text
# GitHub repo > Settings > Secrets > Actions > New secret: FIREBASE_SERVICE_ACCOUNT (har dukaan ka alag project ho to
# har dafa us dukaan ki key daal kar chalayein, ya secret ka naam badal kar). JSON file phone se mita dein.
name: Deploy Firebase (rules + indexes)
# what = privacy: web_installment/ (privacy policy + index) Firebase Hosting par -> https://<project>.web.app/privacy.html
# (service account ko IAM mein 'Firebase Hosting Admin' role bhi chahiye).

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Firebase project ID (Installment dukaan ka, POS ka nahi)'
        required: true
      what:
        description: 'Kya deploy karna hai'
        required: true
        default: both
        type: choice
        options: [both, rules, indexes, privacy, all]
      rules_type:
        description: 'Rules: pos = wahi jo POS par live chal rahi (branch_members); roles = cashier pabandi wali'
        required: true
        default: pos
        type: choice
        options: [pos, roles]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check project id
        env:
          PROJECT: ${{ inputs.project_id }}
        run: |
          echo "$PROJECT" | grep -Eq '^[a-z0-9-]{4,40}$' || { echo "::error::Project ID theek nahi (chhote harf, number, -)"; exit 1; }
          [ "$PROJECT" != "my-grocery-pos-8a444" ] || { echo "::error::Ye Hanna POS ka project hai — Installment ka project dein"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g firebase-tools@14

      - name: Service account
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -n "$SA" ] || { echo "::error::Secret FIREBASE_SERVICE_ACCOUNT nahi mila"; exit 1; }
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print('Key project:',d.get('project_id'))" "$RUNNER_TEMP/sa.json"

      - name: Deploy
        env:
          PROJECT: ${{ inputs.project_id }}
          WHAT: ${{ inputs.what }}
          RULES_TYPE: ${{ inputs.rules_type }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          mkdir -p "$RUNNER_TEMP/fb" && cd "$RUNNER_TEMP/fb"
          # pos: firebase/firestore.rules - Hanna POS par 2026-11-03 se live (branch_members/{uid} + canRead), wahi yahan.
          # roles: firebase/firestore.device-roles.rules (= tools/deploy_rules_live.sh roles): upar + cashier pabandi.
          if [ "$RULES_TYPE" = "roles" ]; then
            cp "$GITHUB_WORKSPACE/firebase/firestore.device-roles.rules" firestore.rules
          else
            cp "$GITHUB_WORKSPACE/firebase/firestore.rules" firestore.rules
          fi
          echo "Rules: $RULES_TYPE"
          cp "$GITHUB_WORKSPACE/firebase/firestore.indexes.json" firestore.indexes.json
          # Privacy site: web_installment/ (nayi zip ke saath). Na ho to repo ki tools/deploy_privacy_site.sh ke andar wale
          # pages nikal lo (purani repo mein wahi hain). Rules / indexes deploy par ye folder zaroori nahi.
          mkdir -p public
          if [ -d "$GITHUB_WORKSPACE/web_installment" ]; then
            cp -R "$GITHUB_WORKSPACE/web_installment/." public/
          elif [ -f "$GITHUB_WORKSPACE/tools/deploy_privacy_site.sh" ]; then
            python3 - "$GITHUB_WORKSPACE/tools/deploy_privacy_site.sh" <<'PYEOF'
          import re, sys
          s = open(sys.argv[1], encoding="utf-8").read()
          for name, body in re.findall(r"cat > public/(\S+) <<'AHPOS_EOF'\n(.*?)\nAHPOS_EOF", s, re.S):
              open("public/" + name, "w", encoding="utf-8").write(body + "\n")
              print("page:", name)
          PYEOF
          fi
          if [ "$WHAT" = "privacy" ] || [ "$WHAT" = "all" ]; then
            [ -f public/privacy.html ] || { echo "::error::privacy.html nahi mila (web_installment / tools/deploy_privacy_site.sh)"; exit 1; }
          fi
          printf '{\n  "firestore": { "rules": "firestore.rules", "indexes": "firestore.indexes.json" },\n  "hosting": { "public": "public", "cleanUrls": false }\n}\n' > firebase.json
          case "$WHAT" in
            rules) ONLY="firestore:rules" ;;
            indexes) ONLY="firestore:indexes" ;;
            privacy) ONLY="hosting" ;;
            all) ONLY="firestore:rules,firestore:indexes,hosting" ;;
            *) ONLY="firestore:rules,firestore:indexes" ;;
          esac
          firebase deploy --only "$ONLY" --project "$PROJECT" --non-interactive
          echo "Ho gaya. Indexes 5-15 minute mein 'Enabled' hote hain (Console > Firestore > Indexes)."
          case "$WHAT" in privacy|all) echo "Privacy: https://$PROJECT.web.app/privacy.html" ;; esac

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
